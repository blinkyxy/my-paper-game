<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper (ripping) Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bgMusic" src="./assets/relaxing music.mp3" autoplay loop></audio>
    <main class="main">
        <header class="page-header">
            <h1>Game about ripping a piece of paper</h1>
            <div style= "text-align:center; font-size: 30px"><p id="click" ;text-align: center;">Click the button to cut the paper in half!</p></div>
        </header>
        <hr>
        <div class="image-container">
            <div class="image-container-wrap"><img id="slot-1" src="" alt="image not found"></div>
            <div class="image-container-wrap"><img id="slot-2" src="" alt="image not found"></div>
            <div class="image-container-wrap"><img id="slot-3" src="" alt="image not found"></div>
            <div class="image-container-wrap"><img id="slot-4" src="" alt="image not found"></div>
        </div>
        <div class="middle-image"><img id="middle-slot" src="" alt="E"></div>
        <button id="cutButton" style="font-size: 24px;padding: 10px 20px; ">Cut Paper</button>
       <div style="font-size: 20px;"> <p id="pieces">Number of pieces: 1</p></div>
        <div id="commentary-container" style="font-size: 55px; text-align: center;"><p id="commentary"></p></div>
    </main>
    <script src="javascript.js"></script>
</body>
</html>
